spring:
  datasource:
    url: jdbc:postgresql://db:5432/propertydb
    username: property_user
    password: property_pass
    deriver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080